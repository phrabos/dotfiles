# Catppuccin Mocha GRUB theme (github.com/catppuccin/grub).
# Named zz- so it is read after kali-themes.cfg (package-owned) and overrides
# its GRUB_THEME and 1280x720 mode. kali-themes.cfg still adds `splash`.
GRUB_THEME="/boot/grub/themes/catppuccin-mocha/theme.txt"
# Set but empty: stops 05_debian_theme putting Kali's desktop-grub.png behind
# the `e` editor and `c` console (Debian #608263); the menu uses the theme anyway.
GRUB_BACKGROUND=""
# Native panel mode, so the theme is not scaled; auto if the firmware lacks it.
GRUB_GFXMODE="1920x1080,auto"
