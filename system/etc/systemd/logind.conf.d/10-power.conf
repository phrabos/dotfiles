# logind - lid and power button. Installed to /etc/systemd/logind.conf.d/
# (see LINUX.md "Sleep, hibernate and the power menu"). Replaces the old
# hand-made 10-lid-hibernate.conf.
#
# Lid on battery: plain suspend. suspend-then-hibernate is deliberately NOT
# used: this laptop only has s2idle, the RTC alarm cannot wake it from s2idle
# without the rtc_cmos.use_acpi_alarm=1 kernel parameter, so it never got to
# the hibernate half and every backpack trip ended in a dead battery and a
# cold boot (journal, 2026-09-16 to 09-22). Omarchy reached the same place and
# dropped suspend-then-hibernate too. Before a bag: Hibernate from the power
# menu.
#
# Lid on AC or docked: nothing, so a docked laptop keeps driving an external
# display with the lid shut.
#
# Power key: ignored here so Hyprland can bind it to the power menu
# (XF86PowerOff in hyprland.lua), as Omarchy does. This only applies to a
# running system - from off or hibernated the button is the firmware's and
# powers on; holding it still forces power off. Under XFCE the key does
# nothing until xfce4-power-manager is set to handle it.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandlePowerKey=ignore
