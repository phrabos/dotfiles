# UPower - critical battery action. Installed to /etc/UPower/UPower.conf.d/
# (UPower 1.91 reads this directory, so the packaged UPower.conf stays
# untouched). See LINUX.md "Sleep, hibernate and the power menu".
#
# Hibernate at 5% instead of the packaged "Auto" at 2%: writing several GB of
# image to swap needs a few seconds of real power, and readings get
# unreliable near empty. Explicit Hibernate rather than Auto, which would pick
# HybridSleep first. Only acts while the system is awake - it cannot fire
# from inside suspend. Must satisfy Low > Critical > Action.
[UPower]
PercentageLow=20
PercentageCritical=10
PercentageAction=5
CriticalPowerAction=Hibernate
