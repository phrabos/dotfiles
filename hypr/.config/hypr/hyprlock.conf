# hyprlock - lock screen. Catppuccin Mocha, mauve accent, IosevkaTerm.
#
# Bound to SUPER+L (xflock4's shortcut from XFCE). hypridle also calls it via
# `loginctl lock-session` before any suspend or hibernate.
#
# Layout, after the well-regarded hyprlock rices (mahaveergurjar/Hyprlock-Dots,
# catppuccin/hyprlock): one frosted card in the centre holding a stacked
# clock, the date, a greeting and the password field; weather and battery in
# the bottom corners; the rest is wallpaper.
#
#                ┌──────────────────────┐
#                │          22          │  mauve
#                │          41          │  pink
#                │  Tuesday, 23 September│
#                │     Good evening     │
#                │  ( 󰌾  Password     ) │
#                └──────────────────────┘
#   󰖐 58°F Overcast                                   󰁹 100%
#
# It is a LOCK screen, so it shows nothing a passer-by should not learn: no
# username (not in the greeting, not in the placeholder), no hostname, no IP
# or interface, no place name with the weather. Notifications cannot appear
# over it - while locked Hyprland draws only the lock surface.
#
# Every key is from the hyprlock wiki for 0.9.6. Test changes with SUPER+L:
# hyprlock reads this file each time it starts.

# Propo, not Mono: Mono squeezes Nerd Font icons to one cell (the weather and
# battery icons would be specks). The letters are the same in both builds.
$font = IosevkaTerm Nerd Font Propo

# Catppuccin Mocha
$base     = rgba(1e1e2eff)
$surface0 = rgba(313244ff)
$text     = rgba(cdd6f4ff)
$subtext1 = rgba(bac2deff)
$subtext0 = rgba(a6adc8ff)
$mauve    = rgba(cba6f7ff)
$pink     = rgba(f5c2e7ff)
$red      = rgba(f38ba8ff)
$yellow   = rgba(f9e2afff)
$shadow   = rgba(11111bcc)   # crust

general {
    hide_cursor = true
}

# No animations, as Omarchy. A fade-in races sleep: hypridle releases the
# sleep inhibitor the moment the session is locked, so the machine used to
# suspend/hibernate mid-fade and resume on that half-faded frame, which
# looked like the desktop flashing before the lock screen.
animations {
    enabled = false
}

# ─── Background ───────────────────────────────────────────────────────────
# The current wallpaper, not `path = screenshot`: a screenshot background
# shows (blurred) whatever was on screen, which on a lab box can be client
# data. ~/.local/state/wallpaper/current is a symlink kept by
# ~/.local/bin/wallpaper; `color` is the fallback if it is missing.
#
# Light blur plus dimming keeps the wallpaper recognisable while the darker
# tone says "locked". Total blur is roughly passes x size. brightness /
# contrast / vibrancy are applied by the blur pass, so need blur_passes >= 1.
#   clearer -> blur_size 2        darker -> brightness 0.45
background {
    monitor =
    path = ~/.local/state/wallpaper/current
    color = $base
    blur_passes = 2
    blur_size = 4         # hyprlock default is 7
    brightness = 0.6
    contrast = 0.9
    vibrancy = 0.2
}

# ─── Card ─────────────────────────────────────────────────────────────────
# Frosted panel behind the centre column: base at 0.55 over the dimmed
# wallpaper, with the same 2px mauve border as a focused Hyprland window.
shape {
    monitor =
    size = 440, 480
    color = rgba(1e1e2e8c)
    rounding = 18
    border_size = 2
    border_color = $mauve
    position = 0, 30
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = $shadow
}

# ─── Clock: hours over minutes ────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +%H
    font_family = $font
    font_size = 110
    color = $mauve
    position = 0, 175
    halign = center
    valign = center
    shadow_passes = 2
    shadow_color = $shadow
}

label {
    monitor =
    text = cmd[update:1000] date +%M
    font_family = $font
    font_size = 110
    color = $pink
    position = 0, 55
    halign = center
    valign = center
    shadow_passes = 2
    shadow_color = $shadow
}

# ─── Date and greeting ────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_family = $font
    font_size = 18
    color = $subtext1
    position = 0, -35
    halign = center
    valign = center
    shadow_passes = 1
    shadow_color = $shadow
}

# Time-of-day greeting, deliberately without the username.
label {
    monitor =
    text = cmd[update:60000] ~/.local/bin/lock-greeting
    font_family = $font
    font_size = 15
    color = $subtext0
    position = 0, -72
    halign = center
    valign = center
}

# ─── Password ─────────────────────────────────────────────────────────────
# Pill field. Outline: mauve idle, blue while checking, red on failure (with
# the reason and attempt count), yellow with Caps Lock on.
input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    rounding = -1

    inner_color = rgba(3132449a)   # surface0 @ 0.6
    outer_color = $mauve
    check_color = rgba(89b4faff)   # blue
    fail_color = $red
    capslock_color = $yellow
    font_color = $text
    font_family = $font

    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true

    placeholder_text = <span foreground="##a6adc8">󰌾  Password</span>
    fail_text = <span foreground="##f38ba8">$FAIL ($ATTEMPTS)</span>

    position = 0, -145
    halign = center
    valign = center
    shadow_passes = 2
    shadow_color = $shadow
}

# ─── Corners: weather and battery ─────────────────────────────────────────
# Weather refreshes every 15 min (one wttr.in request each time; cached, so
# offline it shows the last reading). See ~/.local/bin/lock-weather.
label {
    monitor =
    text = cmd[update:900000] ~/.local/bin/lock-weather
    font_family = $font
    font_size = 15
    color = $subtext1
    position = 40, 36
    halign = left
    valign = bottom
    shadow_passes = 1
    shadow_color = $shadow
}

label {
    monitor =
    text = cmd[update:30000] ~/.local/bin/lock-battery
    font_family = $font
    font_size = 15
    color = $subtext1
    position = -40, 36
    halign = right
    valign = bottom
    shadow_passes = 1
    shadow_color = $shadow
}
