# hyprlock - lock screen. Catppuccin Mocha, IosevkaTerm Nerd Font Mono.
#
# Bound to SUPER+L and CTRL+ALT+L, matching the two xflock4 shortcuts from
# XFCE. hypridle also calls it via `loginctl lock-session` before suspend.
#
# Key names verified against /usr/share/hypr/hyprlock.conf as shipped with
# hyprlock 0.9.6.

$font = IosevkaTerm Nerd Font Mono

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# A blurred snapshot of the desktop, so the lock screen looks like the session
# rather than a black void.
background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    rounding = 15

    inner_color = rgba(30, 30, 46, 0.8)   # base @ 0.8, matching ghostty
    outer_color = rgba(cba6f7ff)          # mauve
    check_color = rgba(89b4faff)          # blue   - authenticating
    fail_color  = rgba(f38ba8ff)          # red    - wrong password

    font_color = rgba(cdd6f4ff)           # text
    font_family = $font

    fade_on_empty = false
    dots_spacing = 0.3

    placeholder_text = <span foreground="##a6adc8">Password</span>
    fail_text = $PAMFAIL

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgba(cdd6f4ff)

    position = -40, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    color = rgba(a6adc8ff)                # subtext0

    position = -40, -140
    halign = right
    valign = top
}

# Which interface / IP is live, so a glance at the lock screen answers the
# question that matters most on a lab box.
label {
    monitor =
    text = cmd[update:5000] ip route show default 2>/dev/null | awk '/^default/ {print $5; exit}'
    font_size = 16
    font_family = $font
    color = rgba(a6e3a1ff)                # green

    position = 40, 40
    halign = left
    valign = bottom
}
