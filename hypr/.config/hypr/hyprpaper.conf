# hyprpaper - wallpaper daemon, started from hyprland.lua's hyprland.start hook.
#
# hyprpaper 0.8.x uses `wallpaper { }` blocks. The older flat form
# (`preload = path` plus `wallpaper = monitor,path`) is gone - there is no
# preload step any more, and a config written that way does nothing.
#
# This file is machine-local: the path names an image in ~/Pictures that will
# not exist on a fresh clone. Absolute paths only - a path that fails to
# resolve is ignored silently, the same trap as zellij's default_cwd
# (see README, "Machine-local settings").

wallpaper {
    monitor  = eDP-1
    path     = /home/phrabos/Pictures/wallpapers/wallhaven-o5jv65.jpg
    fit_mode = cover
}

# Empty monitor = fallback for any output without its own assignment, so an
# external display is not left black.
wallpaper {
    monitor  =
    path     = /home/phrabos/Pictures/wallpapers/wallhaven-o5jv65.jpg
    fit_mode = cover
}

splash = false
ipc    = true
