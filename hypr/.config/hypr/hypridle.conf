# hypridle - idle daemon.
#
# Deliberately conservative, because it mirrors what XFCE actually does on this
# machine rather than the hypridle sample:
#
#   xfce4-screensaver  /lock/saver-activation/enabled = false  -> NO idle lock
#   xfce4-power-manager dpms-on-ac-off/sleep       = 0         -> NO DPMS
#                       dpms-on-battery-off/sleep  = 0         -> NO DPMS
#                       lock-screen-suspend-hibernate = true   -> lock on suspend
#                       logind-handle-lid-switch      = true   -> logind owns lid
#
# So the only things enabled here are the two XFCE genuinely did: lock before
# sleep, and bring the screen back after resume. The lid is left to logind,
# which is already set to suspend-then-hibernate on battery and ignore on AC.
#
# The commented listeners below are the sample's defaults. Uncomment them if
# you want a laptop that actually dims and sleeps on idle - reasonable on
# battery, but it would be a change from your XFCE behaviour, not a match.
#
# Syntax verified against /usr/share/hypr/hypridle.conf as shipped with
# hypridle 0.1.8. Note the Lua dispatch form - `hyprctl dispatch 'hl.dsp...'`
# - which is required since Hyprland 0.55.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# --- optional idle behaviour, off by default to match XFCE -------------------

# Dim the backlight after 5 minutes.
# listener {
#     timeout = 300
#     on-timeout = brightnessctl -s set 10
#     on-resume = brightnessctl -r
# }

# Lock after 10 minutes.
# listener {
#     timeout = 600
#     on-timeout = loginctl lock-session
# }

# Screen off after 11 minutes.
# listener {
#     timeout = 660
#     on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
#     on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
# }

# Suspend after 30 minutes.
# listener {
#     timeout = 1800
#     on-timeout = systemctl suspend
# }
