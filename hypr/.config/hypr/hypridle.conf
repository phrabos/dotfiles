# hypridle - idle daemon.
#
# The ladder while the laptop is open and untouched:
#
#   2.5 min  dim screen + keyboard backlight   (warning that a lock is coming)
#   5   min  lock                              (hyprlock; everything keeps running)
#   5.5 min  screen off                        (still locked, still running)
#   60  min  hibernate - ON BATTERY ONLY       (session to swap, power fully off)
#
# Shaped on Omarchy v3 plus hypridle's own documented example
# (/usr/share/hypr/hypridle.conf), with one deliberate difference: no idle
# *suspend*. Suspend on this machine is s2idle, which drains a full battery in
# about a day, and nothing can wake it later to hibernate (that needs the
# rtc_cmos.use_acpi_alarm=1 kernel parameter, which Omarchy used and we chose
# not to - and Omarchy itself dropped suspend-then-hibernate after it
# wake-looped on too many laptops). So the long step is hibernate, and only on
# battery: on AC, long scans, downloads and VPN sessions keep running.
#
# This file only covers an awake, open laptop. The lid is logind's (plain
# suspend on battery, ignored on AC), and before a bag the answer is
# Hibernate from the power menu - see system/ and LINUX.md.
#
# Idle inhibitors are respected (the defaults): a playing video or a call
# holds all of this off.
#
# Every option used here is in the hypridle wiki for 0.1.8 and was checked
# against the installed binary.

general {
    lock_cmd = pidof hyprlock || hyprlock                                  # one hyprlock at a time
    before_sleep_cmd = loginctl lock-session                               # lock before suspend/hibernate
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'      # screen on after resume, no key press needed
    inhibit_sleep = 3                                                      # hold sleep until the lock screen is actually up
}

# 2.5 min: dim, as a warning. -s saves the level and -r restores it.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 150
    on-timeout = brightnessctl -sd tpacpi::kbd_backlight set 0
    on-resume = brightnessctl -rd tpacpi::kbd_backlight
}

# 5 min: lock.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 60 min on battery: hibernate, so an open laptop left unplugged cannot drain
# to empty and lose the session. condition_cmd gates it: AC/online is 1 when
# plugged in, which defers the step. condition_retry re-checks every minute
# while still idle, so unplugging a long-idle laptop hibernates it a minute
# later instead of waiting another hour.
listener {
    timeout = 3600
    condition_cmd = [ "$(cat /sys/class/power_supply/AC/online)" = 0 ]
    condition_retry = 60
    on-timeout = systemctl hibernate
}
