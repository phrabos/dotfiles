# hyprtoolkit - theme for Hyprland's own GUI apps: hyprlauncher (ALT+D),
# hyprshutdown's closing screen, hyprland-dialog and the welcome/update
# screens. Catppuccin Mocha with a mauve accent, matching waybar, swaync,
# ghostty and hyprland.lua's borders.
#
# Without this file hyprtoolkit falls back to its built-in palette, whose
# accent is 0xFF00FFCC - the teal-green hyprlauncher showed.
#
# Keys and defaults: https://wiki.hypr.land/Hypr-Ecosystem/hyprtoolkit/
# (user docs). Colours use the same syntax as Hyprland's.

background       = rgba(1e1e2eff)   # base - window background
base             = rgba(181825ff)   # mantle - input fields, list background
alternate_base   = rgba(313244ff)   # surface0 - alternate rows, hovered entries
text             = rgba(cdd6f4ff)   # text
bright_text      = rgba(1e1e2eff)   # base - text drawn on the accent (selected entry)
accent           = rgba(cba6f7ff)   # mauve - selection, focus
accent_secondary = rgba(89b4faff)   # blue

font_family           = IosevkaTerm Nerd Font Propo
font_family_monospace = IosevkaTerm Nerd Font Mono

icon_theme = Papirus-Dark

# hyprland.lua decoration.rounding is 8; waybar chips are 6.
rounding_large = 8
rounding_small = 6
