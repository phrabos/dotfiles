add_newline = false
command_timeout = 500
palette = "catppuccin_mocha"

# Explicit module list instead of $all, so ordering is fixed and unused modules
# cost nothing. Everything after $fill is right-aligned.
format = """
$directory$git_branch$git_status$git_state$fill$claude_model$claude_context$claude_cost$nodejs$python$golang$rust$conda$package$docker_context$kubernetes$aws$gcloud$azure$jobs$cmd_duration
$character"""

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[✗](bold red)'
vimcmd_symbol = '[N](bold green)'
vimcmd_replace_one_symbol = '[R](bold peach)'
vimcmd_replace_symbol = '[R](bold peach)'
vimcmd_visual_symbol = '[V](bold mauve)'

[directory]
style = "bold sapphire"
truncation_length = 5
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " "
read_only_style = "bold red"

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '
style = "bold mauve"
symbol = " "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold red"
conflicted = '[~$count](bold red)'
ahead = '[⇡$count](bold green)'
behind = '[⇣$count](bold yellow)'
diverged = '[⇕$count](bold mauve)'
untracked = '[?$count](bold overlay1)'
stashed = '[\$$count](bold sapphire)'
modified = '[!$count](bold yellow)'
staged = '[+$count](bold green)'
renamed = '[»$count](bold peach)'
deleted = '[✘$count](bold red)'

[git_state]
style = "bold peach"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[fill]
symbol = " "
style = "surface1"

[cmd_duration]
min_time = 500
format = '[ $duration]($style)'
style = "bold yellow"

[jobs]
symbol = "✦"
format = '[$symbol$number]($style) '
number_threshold = 1
symbol_threshold = 1
style = "bold blue"

[claude_model]
symbol = "󰚩 "
format = '[$symbol$model]($style) '
style = "bold lavender"

[claude_context]
format = '[$gauge $percentage]($style) '

[claude_cost]
symbol = "󰈔 "
format = '[$symbol(\$$cost)]($style) '

[aws]
format = '[$symbol($profile )(\($region\) )]($style)'
disabled = false
style = 'bold peach'
symbol = " "

[gcloud]
symbol = "☁ "
format = '[$symbol($project )]($style)'
style = "bold sapphire"
disabled = false

[azure]
symbol = "󰠅 "
format = '[$symbol($subscription )]($style)'
style = "bold blue"
disabled = false

[golang]
symbol = " "
format = '[$symbol($version )]($style)'
style = "bold sky"

[nodejs]
symbol = " "
format = '[$symbol($version )]($style)'
style = "bold green"
disabled = false
detect_extensions = ["js", "mjs", "cjs", "ts", "mts", "cts"]
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

[python]
symbol = " "
format = '[$symbol($version )(\($virtualenv\) )]($style)'
style = "bold yellow"

[rust]
symbol = " "
format = '[$symbol($version )]($style)'
style = "bold red"

[kubernetes]
symbol = '☸ '
disabled = false
detect_files = ['Dockerfile', 'k8s']
format = '[$symbol$context( \($namespace\))]($style) '
style = "bold sky"
contexts = []

[docker_context]
symbol = " "
format = '[$symbol$context ]($style)'
style = "bold blue"
disabled = false

[conda]
symbol = " "
format = '[$symbol$environment ]($style)'
style = "bold green"
ignore_base = true

[package]
disabled = true

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# Remap ANSI color names onto Catppuccin so any module default that uses them
# (kubernetes=cyan, fill=black, package=208, …) resolves to the palette too.
purple = "#cba6f7"
cyan = "#89dceb"
black = "#45475a"
white = "#cdd6f4"
bright-black = "#6c7086"
bright-red = "#eba0ac"
bright-green = "#a6e3a1"
bright-yellow = "#f9e2af"
bright-blue = "#89b4fa"
bright-purple = "#f5c2e7"
bright-cyan = "#94e2d5"
bright-white = "#bac2de"
