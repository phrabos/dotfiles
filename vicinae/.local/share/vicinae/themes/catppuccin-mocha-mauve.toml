# Copy of the catppuccin-mocha theme bundled with Vicinae v0.29.0, accent
# switched from blue to mauve. Theme id = filename: catppuccin-mocha-mauve.

# Catppuccin Mocha - The Original
# Our darkest variant offering a cozy feeling with color-rich accents

[meta]
version = 1
name = "Catppuccin Mocha (mauve)"
description = "Catppuccin Mocha with the mauve accent used across these dotfiles (Hyprland borders, waybar, starship)."
variant = "dark"

[colors.core]
background = "#1E1E2E"        # Base
foreground = "#CDD6F4"        # Text
secondary_background = "#181825"  # Mantle
border = "#424265"            # Surface0
accent = "#CBA6F7"            # Mauve (bundled theme uses Blue)

[colors.accents]
blue = "#89B4FA"
green = "#A6E3A1"
magenta = "#F5C2E7"
orange = "#FAB387"
purple = "#CBA6F7"
red = "#F38BA8"
yellow = "#F9E2AF"
cyan = "#94E2D5"

[colors.list.item.selection]
background = "#41425d"
secondary_background = "#383A4A"


[colors.grid.item]
background = "#383856"
