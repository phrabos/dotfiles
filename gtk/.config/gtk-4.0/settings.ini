# GTK4 settings, ported from XFCE's xsettings channel.
#
# GTK4 ignores gtk-theme-name (it uses libadwaita, styled via the
# color-scheme preference rather than a theme name), so only the settings it
# actually honours are listed here. prefer-dark comes from gsettings
# org.gnome.desktop.interface color-scheme, already set to 'prefer-dark'.

[Settings]
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Iosevka Nerd Font 11
gtk-application-prefer-dark-theme=1

gtk-cursor-theme-name=catppuccin-mocha-mauve-cursors
gtk-cursor-theme-size=24

gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb

gtk-enable-primary-paste=false
gtk-decoration-layout=icon,menu:minimize,maximize,close
