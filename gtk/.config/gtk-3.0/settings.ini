# GTK3 settings, ported from XFCE's xsettings channel.
#
# Under XFCE these came from xfsettingsd over the XSETTINGS protocol. Hyprland
# runs no settings daemon, so GTK falls back to two sources: the
# org.freedesktop.portal.Settings portal (which xdg-desktop-portal-gtk backs
# with gsettings, and which already returns the right theme here) and this
# file. The portal only serves theme/icon/font/color-scheme, so everything
# below that it does not cover - Xft hinting, primary paste, decoration
# layout - would otherwise silently revert to GTK defaults.
#
# Values verified against `xfconf-query -c xsettings -lv` on the XFCE side.

[Settings]
gtk-theme-name=Catppuccin-Mauve-Dark
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Iosevka Nerd Font 11
gtk-application-prefer-dark-theme=1

gtk-cursor-theme-name=catppuccin-mocha-mauve-cursors
gtk-cursor-theme-size=24

# Font rendering - XFCE set these explicitly; GTK's defaults differ.
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb

# XFCE had /Gtk/EnablePrimaryPaste = false, i.e. middle-click does NOT paste
# the primary selection into GTK text fields. Carried over deliberately.
gtk-enable-primary-paste=false

gtk-decoration-layout=icon,menu:minimize,maximize,close
gtk-button-images=1
gtk-menu-images=1
gtk-enable-animations=1
gtk-overlay-scrolling=1
